<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.name }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 25 }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom.css?v={{ site.time | date: '%s' }}">
</head>
<body class="split-magazine-theme">
    <div class="split-layout">
        <aside class="sidebar fade-in" id="sidebar">
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="sidebar-inner">
                <div class="brand">
                    <a href="{{ site.baseurl }}/" class="logo">Pratik's Blogs</a>
                    <p class="bio">Mobile App Development & AI Systems</p>
                </div>
                
                <nav class="nav-links">
                    <a href="{{ site.baseurl }}/" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">About</a>
                    <a href="{{ site.baseurl }}/blog/" class="{% if page.url contains '/blog' %}active{% endif %}">Writing</a>
                    <a href="{{ site.baseurl }}/#projects">Projects</a>
                    <a href="{{ site.baseurl }}/#certifications">Certifications</a>
                    <a href="https://github.com/Pratikdate" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/pratik-date-883023244/" target="_blank" rel="noopener">LinkedIn</a>
                    <a href="https://wa.me/pratik_date" target="_blank" rel="noopener">WhatsApp</a>
                </nav>
                
                <footer class="sidebar-footer">
                    <p>&copy; 2026 Pratik.<br>Keep building.</p>
                </footer>
            </div>
        </aside>

        <main class="content-pane fade-in">
            {{ content }}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Jekyll markdown renders mermaid as <code class="language-mermaid"> inside a <pre>
            // We need to convert these into <div class="mermaid"> for Mermaid.js to work properly
            document.querySelectorAll('code.language-mermaid').forEach((block) => {
                const parentPre = block.parentElement;
                if (parentPre && parentPre.tagName === 'PRE') {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = block.textContent;
                    parentPre.replaceWith(mermaidDiv);
                }
            });
            mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
        });
    </script>
    <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
